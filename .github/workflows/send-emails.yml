# Sends the emails waiting in the database (welcome, school changes, Premium receipts) every 15 minutes.
# The website also starts a run right after a sign-up or a change, so most emails go out within seconds.
# Needs the repository secret SUPABASE_SERVICE_ROLE_KEY (already used by the deploy) and the Edge Function "send-emails".
name: Send queued emails

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    env:
      SUPABASE_URL: https://usehxhvzhdbcmnmqaxoo.supabase.co
      KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Run the email sender
        run: |
          if [ -z "$KEY" ]; then echo "Add the repository secret SUPABASE_SERVICE_ROLE_KEY."; exit 0; fi
          code=$(curl -sS -o "$RUNNER_TEMP/out.json" -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" -d '{}' \
            "$SUPABASE_URL/functions/v1/send-emails")
          echo "send-emails responded with HTTP $code"; cat "$RUNNER_TEMP/out.json"; echo
          if [ "$code" = "404" ]; then echo "The Edge Function send-emails is not deployed yet."; exit 0; fi
          if [ "$code" -ge 500 ]; then exit 1; fi
